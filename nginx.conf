# -----------------------------------------------------------------------------
# YBS, servidor do site estático.
# Este arquivo substitui o /etc/nginx/conf.d/default.conf da imagem oficial.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;

    # Atrás do proxy do EasyPanel, evita redirecionar para o host interno
    absolute_redirect off;
    port_in_redirect off;

    # ---------------------------------------------------------- compressão --
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ------------------------------------------------ cabeçalhos de segurança --
    # Observação: nenhuma location abaixo usa add_header, para que estes
    # cabeçalhos continuem sendo herdados em todas as respostas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # ---------------------------------------------------------- healthcheck --
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Arquivos de indexação de buscadores
    location = /robots.txt { access_log off; expires 1d; }
    location = /sitemap.xml { expires 1d; }
    location = /manifest.webmanifest { expires 7d; }

    # --------------------------------------------------------------- cache --
    # CSS e JS: uma semana. As páginas chamam styles.css?v=1, então basta
    # subir o número da versão quando o arquivo mudar.
    location ~* \.(?:css|js|mjs)$ {
        expires 7d;
        access_log off;
    }

    # Imagens e fontes: trinta dias.
    location ~* \.(?:svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|eot|pdf)$ {
        expires 30d;
        access_log off;
    }

    # HTML sempre revalidado, para o conteúdo novo aparecer logo após o deploy.
    location / {
        try_files $uri $uri/ $uri.html =404;
        expires -1;
    }

    # ------------------------------------------------------------- erros --
    error_page 404 /404.html;
    error_page 500 502 503 504 /404.html;

    # Bloqueia o acesso a arquivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
